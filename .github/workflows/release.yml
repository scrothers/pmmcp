name: release

# Cuts a GitHub Release with cross-platform archives + checksums via GoReleaser
# whenever a v* tag is pushed, then attests build provenance (SLSA) for every
# archive and the checksum file. Kept separate from ci.yml so the CI workflow
# stays read-only; only this workflow gets write scopes, and only on tags.
#
# Verify a downloaded artifact against its provenance with:
#   gh attestation verify <file> --repo scrothers/pmmcp
#
# Actions are SHA-pinned (with the version in a comment) per supply-chain
# hardening. Verified upstream on 2026-08-08:
#   actions/checkout                 v7.0.1
#   actions/setup-go                 v7.0.0
#   goreleaser/goreleaser-action     v7.2.3   (GoReleaser CLI pinned to v2 via `version`)
#   actions/attest-build-provenance  v4.2.2

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the workflow level; the goreleaser job elevates only the
# scopes it needs (Scorecard TokenPermissions).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload the built assets
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation via the GitHub attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance for everything a user would download: the per-OS/arch
      # archives, the Linux distro packages, and the checksum manifest that
      # vouches for them.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/checksums.txt
